<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenKI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>GenKI</h1>
    <p>Virtual gene knock-out inference — local run, no data leaves this machine.</p>
  </header>

  <main>
    <section id="dataset-section">
      <h2><span class="step">1</span> Dataset</h2>
      <div class="row">
        <button id="use-example" type="button">Use bundled example dataset</button>
        <span class="or">or</span>
        <label class="file-input" for="file-input">
          Upload .h5ad
          <input type="file" id="file-input" accept=".h5ad">
        </label>
      </div>
      <p id="dataset-error" class="error hidden"></p>
      <p id="dataset-info" class="info hidden"></p>
    </section>

    <section id="run-section" class="hidden">
      <h2><span class="step">2</span> Configure run</h2>
      <form id="run-form">
        <label class="field">
          <span class="field-label">Target gene(s) to knock out
            <span class="info-icon" tabindex="0" data-tooltip="Gene(s) to virtually knock out. Their expression is zeroed and the model reports how much every other gene's inferred distribution shifts in response." aria-label="Gene(s) to virtually knock out. Their expression is zeroed and the model reports how much every other gene's inferred distribution shifts in response.">i</span>
          </span>
          <input list="gene-list" id="target-gene-input" placeholder="type to search, press Enter to add" autocomplete="off">
          <datalist id="gene-list"></datalist>
        </label>
        <div id="target-gene-chips" class="chips"></div>

        <div class="grid">
          <label class="field" id="obs-label-field" hidden>
            <span class="field-label">Cell metadata column
              <span class="info-icon" tabindex="0" data-tooltip="The adata.obs column used to filter which cells are included, e.g. cell type or condition." aria-label="The adata.obs column used to filter which cells are included, e.g. cell type or condition.">i</span>
            </span>
            <select id="obs-label-select"></select>
          </label>
          <label class="field" id="target-cell-field" hidden>
            <span class="field-label">Cell filter
              <span class="info-icon" tabindex="0" data-tooltip="Restrict the run to cells matching this value in the selected metadata column; leave as “All cells” to use everything." aria-label="Restrict the run to cells matching this value in the selected metadata column; leave as All cells to use everything.">i</span>
            </span>
            <select id="target-cell-select"></select>
          </label>
          <label class="field">
            <span class="field-label">Epochs
              <span class="info-icon" tabindex="0" data-tooltip="Number of training epochs for the VGAE encoder/decoder. More epochs can improve fit but take longer to train." aria-label="Number of training epochs for the VGAE encoder/decoder. More epochs can improve fit but take longer to train.">i</span>
            </span>
            <input type="number" id="epochs" value="100" min="1" max="5000">
          </label>
          <label class="field">
            <span class="field-label">Learning rate
              <span class="info-icon" tabindex="0" data-tooltip="Adam optimizer learning rate used to train the VGAE." aria-label="Adam optimizer learning rate used to train the VGAE.">i</span>
            </span>
            <input type="number" id="lr" value="0.0007" step="0.0001" min="0">
          </label>
          <label class="field">
            <span class="field-label">Seed <span class="hint">(optional)</span>
              <span class="info-icon" tabindex="0" data-tooltip="Random seed for reproducible training and permutation results; leave blank for a random seed each run." aria-label="Random seed for reproducible training and permutation results; leave blank for a random seed each run.">i</span>
            </span>
            <input type="number" id="seed" placeholder="random">
          </label>
          <label class="field">
            <span class="field-label"># permutations
              <span class="info-icon" tabindex="0" data-tooltip="Number of label-permutation samples used to build the null distribution for significance testing. 0 skips the permutation test." aria-label="Number of label-permutation samples used to build the null distribution for significance testing. 0 skips the permutation test.">i</span>
            </span>
            <input type="number" id="n-permutations" value="100" min="0" max="2000">
          </label>
          <label class="field">
            <span class="field-label">Distance metric
              <span class="info-icon" tabindex="0" data-tooltip="How the knock-out vs wild-type latent distributions are compared per gene: KL divergence, Earth mover's distance, or a t-statistic." aria-label="How the knock-out vs wild-type latent distributions are compared per gene: KL divergence, Earth mover's distance, or a t-statistic.">i</span>
            </span>
            <select id="by">
              <option value="KL" selected>KL divergence</option>
              <option value="EMD">Earth mover's distance</option>
              <option value="t">t-statistic</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Parallel workers
              <span class="info-icon" tabindex="0" data-tooltip="CPU workers used to build the gene regulatory network. -1 (default) uses all local cores for the fastest build; must not be 0. Uses the ray extra bundled with GenKI[web] &mdash; falls back to a single process if ray isn't installed." aria-label="CPU workers used to build the gene regulatory network. -1 (default) uses all local cores for the fastest build; must not be 0. Uses the ray extra bundled with GenKI web install, falls back to a single process if ray isn't installed.">i</span>
            </span>
            <input type="number" id="n-cpus" value="-1" step="1" min="-1">
          </label>
        </div>

        <button type="submit" id="run-button">Run knock-out</button>
      </form>
    </section>

    <section id="results-section" class="hidden">
      <h2><span class="step">3</span> Results</h2>
      <div id="progress-wrap" class="progress-wrap hidden">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="status-bar" class="status"></p>
      <p id="results-error" class="error hidden"></p>
      <div id="results-table-wrap"></div>
      <a id="download-csv" class="hidden" download>Download CSV</a>
    </section>
  </main>

  <footer>
    GenKI &mdash; <a href="https://github.com/yjgeno/GenKI" target="_blank" rel="noopener">source &amp; docs</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
